name: RDP

on:
  workflow_dispatch:
    inputs:
      ts_tailnet:
        description: "Tailscale tailnet (example@gmail.com)"
        required: true
      ts_api_key:
        description: "Tailscale API key (device admin)"
        required: true
      ts_authkey:
        description: "Tailscale Auth key"
        required: true
      runtime_minutes:
        description: "Runtime minutes (max 360)"
        required: false
        default: "355"

permissions:
  contents: read
  actions: write

defaults:
  run:
    shell: pwsh

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 370

    env:
      RDP_USER: cold
      RDP_PASS: cold

    steps:
      # ===============================
      # TAILSCALE
      # ===============================
      - name: Install & Connect Tailscale
        run: |
          $ts = "$env:ProgramFiles\Tailscale\tailscale.exe"
          if (-not (Test-Path $ts)) {
            $msi = "$env:TEMP\tailscale.msi"
            Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi -OutFile $msi
            Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
          }
          & $ts up --authkey "${{ inputs.ts_authkey }}" --hostname bullet
          $ip = & $ts ip -4 | Select-Object -First 1
          "TAILSCALE_IP=$ip" | Out-File -Append $env:GITHUB_ENV
          Write-Host "Tailscale IP: $ip"

      # ===============================
      # ENABLE RDP
      # ===============================
      - name: Enable RDP User
        run: |
          $u=$env:RDP_USER
          $p=$env:RDP_PASS | ConvertTo-SecureString -AsPlainText -Force

          if (-not (Get-LocalUser $u -EA SilentlyContinue)) {
            New-LocalUser $u -Password $p -AccountNeverExpires
          } else {
            Set-LocalUser $u -Password $p
          }

          Add-LocalGroupMember Administrators $u -EA SilentlyContinue
          Add-LocalGroupMember "Remote Desktop Users" $u -EA SilentlyContinue
          Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" fDenyTSConnections 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # ===============================
      # INSTALL RUSTDESK
      # ===============================
      - name: Install RustDesk
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          if (-not (Test-Path $rdExe)) {
            $msi = "$env:TEMP\rustdesk.msi"
            Invoke-WebRequest https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.msi -OutFile $msi
            Start-Process msiexec.exe -ArgumentList "/i","`"$msi`"","/quiet","/norestart" -Wait
          }
          Write-Host "RustDesk ready."

      # ===============================
      # OPEN FIREWALL
      # ===============================
      - name: Open RustDesk Ports
        run: |
          21115..21119 | ForEach-Object {
            netsh advfirewall firewall add rule name="RustDesk-TCP-$_" dir=in action=allow protocol=TCP localport=$_
          }
          netsh advfirewall firewall add rule name="RustDesk-UDP-21116" dir=in action=allow protocol=UDP localport=21116

      # ===============================
      # LAUNCH + SCREENSHOT + UPLOAD
      # ===============================
      - name: Launch RustDesk & Upload Screenshot
        run: |
          $rdExe = "C:\Program Files\RustDesk\rustdesk.exe"
          Start-Process $rdExe
          Start-Sleep 5

          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing

          $bounds = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $bounds.Width, $bounds.Height
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.CopyFromScreen($bounds.Location, [System.Drawing.Point]::Empty, $bounds.Size)

          $img = "$env:TEMP\rustdesk.png"
          $bmp.Save($img, [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose(); $bmp.Dispose()

          $res = Invoke-RestMethod `
            -Uri "https://store1.gofile.io/uploadFile" `
            -Method Post `
            -Form @{ file = Get-Item $img }

          if ($res.status -eq "ok") {
            "SCREENSHOT_URL=$($res.data.downloadPage)" | Out-File -Append $env:GITHUB_ENV
            Write-Host "Screenshot URL: $($res.data.downloadPage)"
          } else {
            Write-Error "Upload failed"
          }

      # ===============================
      # KEEP ALIVE
      # ===============================
      - name: Keep Alive
        run: |
          $mins = [int]"${{ inputs.runtime_minutes }}"
          $end = (Get-Date).AddMinutes($mins)
          while ((Get-Date) -lt $end) {
            Write-Host "RDP + RustDesk alive | IP: $env:TAILSCALE_IP | SS: $env:SCREENSHOT_URL"
            Start-Sleep 60
          }
